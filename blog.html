<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Logs | MoonWalkers FTC #38056</title>
    
    <!-- Tailwind CSS with Typography Plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { cyberCyan: '#00f2fe', cyberBlue: '#0284c7', cyberDark: '#080c14' },
                    fontFamily: { heading: ['Orbitron', 'sans-serif'], body: ['Inter', 'sans-serif'], code: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    
    <!-- Lucide Icons & Marked.js Markdown Parser -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-cyberDark text-slate-100 min-h-screen antialiased flex flex-col justify-between pt-[76px]">

    <!-- STICKY HEADER -->
    <header class="bg-cyberDark/90 backdrop-blur-md border-b border-cyan-500/20 fixed top-0 left-0 right-0 z-50 h-[76px] flex items-center">
        <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-cyan-500 to-blue-600 p-2 rounded-xl text-black font-black text-xs font-heading">FIRST</div>
                <div class="flex flex-col">
                    <div class="flex items-center gap-2">
                        <h1 class="font-heading font-extrabold text-lg text-white">MOONWALKERS</h1>
                    </div>
                    <span class="w-max flex-shrink-0 bg-cyan-500/10 border border-cyan-400/30 text-cyberCyan text-[10px] font-bold px-2 py-0.5 rounded-full font-code">FTC #38056</span>
                </div>
            </a>
            <!-- DYNAMIC DESKTOP NAVIGATION CONTAINER -->
            <nav id="desktop-nav" class="hidden md:flex items-center gap-6 ml-12 text-xs font-heading font-semibold uppercase tracking-widest">
                <!-- Populated automatically by assets/js/nav.js -->
            </nav>

            <!-- MOBILE MENU BUTTON -->
            <button id="mobileMenuBtn" class="md:hidden text-2xl text-slate-300 p-2" aria-label="Toggle Navigation">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- DYNAMIC MOBILE MENU DROPDOWN CONTAINER -->
        <div id="mobileMenu" class="hidden md:hidden absolute top-[76px] left-0 right-0 bg-cyberDark/95 border-b border-cyan-500/20 p-6 shadow-2xl">
            <div id="mobile-nav-links" class="flex flex-col gap-4 font-heading text-sm font-semibold">
                <!-- Populated automatically by assets/js/nav.js -->
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT LAYOUT -->
    <main class="py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8 w-full">
        
        <!-- DYNAMIC BLOG CONTAINER -->
        <div class="lg:col-span-2 space-y-6" id="blog-container">
            <div class="p-8 text-center text-slate-400 border border-slate-800 rounded-2xl bg-slate-900/40">
                <i data-lucide="loader" class="w-6 h-6 animate-spin mx-auto text-cyberCyan mb-2"></i>
                <p class="font-code text-xs">Loading Markdown entries...</p>
            </div>
        </div>

        <!-- SIDEBAR -->
        <aside class="space-y-6">
            <div class="glass-card p-6 rounded-2xl border-slate-800">
                <h3 class="font-heading text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Post Archive Filter</h3>
                <div class="flex flex-col gap-2 font-code text-xs">
                    <button onclick="loadBlogPosts(false)" id="filter-active" class="px-3 py-2 rounded-lg bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/40 text-left font-bold">
                        Active Logs
                    </button>
                    <button onclick="loadBlogPosts(true)" id="filter-archived" class="px-3 py-2 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 text-left hover:text-white">
                        Archived / Throwbacks
                    </button>
                </div>
            </div>

            <div class="glass-card p-6 rounded-2xl border-slate-800">
                <h3 class="font-heading text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Repositories & Feeds</h3>
                <div class="space-y-3 font-medium text-sm">
                    <a href="https://github.com" target="_blank" class="flex items-center gap-3 p-3 rounded-xl bg-slate-900/60 hover:text-cyberCyan transition-colors">
                        <i data-lucide="github" class="w-5 h-5 text-white"></i> GitHub Codebase
                    </a>
                    <a href="https://instagram.com" target="_blank" class="flex items-center gap-3 p-3 rounded-xl bg-slate-900/60 hover:text-cyberCyan transition-colors">
                        <i data-lucide="instagram" class="w-5 h-5 text-pink-500"></i> Instagram Updates
                    </a>
                </div>
            </div>
        </aside>
    </main>

    <footer class="bg-slate-950 border-t border-slate-800 text-slate-400 py-8 text-center text-xs">
        <p>&copy; 2026 FTC Team #38056 MoonWalkers.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Configure marked options
            if (typeof marked !== 'undefined') {
                marked.setOptions({
                    gfm: true,
                    breaks: true
                });
            }
            loadBlogPosts(false);
        });

        async function loadBlogPosts(showArchived = false) {
            const container = document.getElementById("blog-container");
            if (!container) return;

            // Sidebar Filter UI state
            const activeBtn = document.getElementById("filter-active");
            const archivedBtn = document.getElementById("filter-archived");
            if (activeBtn && archivedBtn) {
                activeBtn.className = !showArchived 
                    ? "px-3 py-2 rounded-lg bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/40 text-left font-bold" 
                    : "px-3 py-2 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 text-left hover:text-white";
                archivedBtn.className = showArchived 
                    ? "px-3 py-2 rounded-lg bg-cyberCyan/20 text-cyberCyan border border-cyberCyan/40 text-left font-bold" 
                    : "px-3 py-2 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 text-left hover:text-white";
            }

            try {
                // Fetch blog list manifest
                const manifestRes = await fetch("assets/blogs/blog-list.json");
                if (!manifestRes.ok) throw new Error("Could not find blog-list.json");

                const posts = await manifestRes.json();
                const filteredPosts = posts.filter(p => Boolean(p.archived) === showArchived);

                container.innerHTML = "";

                if (filteredPosts.length === 0) {
                    container.innerHTML = `<div class="p-6 text-slate-400 font-code text-xs">No entries found.</div>`;
                    return;
                }

                for (const post of filteredPosts) {
                    let parsedContent = "";

                    try {
                        const mdRes = await fetch(`assets/blogs/${post.filename}`);
                        if (mdRes.ok) {
                            const rawMarkdown = await mdRes.text();
                            // Parse markdown string into HTML via marked.js
                            parsedContent = typeof marked !== 'undefined' 
                                ? marked.parse(rawMarkdown) 
                                : rawMarkdown;
                        } else {
                            parsedContent = `<p class="text-amber-400 font-code text-xs">Missing markdown file: <code>${post.filename}</code></p>`;
                        }
                    } catch (err) {
                        parsedContent = `<p class="text-red-400 font-code text-xs">Error fetching markdown file.</p>`;
                    }

                    // Render Card matching Screenshot 1 layout with prose class for Markdown formatting
                    const card = document.createElement("article");
                    card.className = "glass-card p-6 sm:p-8 rounded-2xl border border-slate-800 space-y-4";
                    card.innerHTML = `
                        <div class="flex items-center gap-2 text-xs font-code text-cyberCyan font-semibold">
                            <i data-lucide="calendar" class="w-4 h-4"></i>
                            <span>${post.date}</span>
                        </div>
                        <h2 class="font-heading text-2xl font-bold text-white">${post.title}</h2>
                        
                        <!-- Tailwind Typography (prose) formats standard markdown elements cleanly -->
                        <div class="prose prose-invert prose-cyan max-w-none text-slate-300 text-sm leading-relaxed space-y-3 pt-2 
                                    prose-headings:font-heading prose-headings:text-white prose-h1:text-xl prose-h2:text-lg prose-h3:text-base 
                                    prose-strong:text-white prose-code:text-cyberCyan prose-hr:border-slate-800">
                            ${parsedContent}
                        </div>
                    `;
                    container.appendChild(card);
                }

                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }

            } catch (error) {
                container.innerHTML = `
                    <div class="p-6 border border-red-500/30 rounded-2xl bg-red-500/10 text-red-400 font-code text-xs">
                        <strong class="block text-white mb-1">Failed to load blog logs</strong>
                        Ensure <code>assets/blogs/blog-list.json</code> exists and you are running via a local web server (e.g. VS Code Live Server).
                    </div>
                `;
            }
        }
    </script>
    <!-- NAVIGATION & SCRIPTS -->
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
