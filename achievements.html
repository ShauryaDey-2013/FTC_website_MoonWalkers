<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Trophy Room | MoonWalkers FTC #38056</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { cyberCyan: '#00f2fe', cyberBlue: '#0284c7', cyberDark: '#080c14' },
                    fontFamily: { heading: ['Orbitron', 'sans-serif'], body: ['Inter', 'sans-serif'], code: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cyberDark text-slate-100 min-h-screen antialiased flex flex-col justify-between pt-[76px]">

    <header class="bg-cyberDark/90 backdrop-blur-md border-b border-cyan-500/20 fixed top-0 left-0 right-0 z-50 h-[76px] flex items-center">
        <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-cyan-500 to-blue-600 p-2 rounded-xl text-black font-black text-xs font-heading">FIRST</div>
                <div class="flex flex-col">
                    <div class="flex items-center gap-2">
                        <h1 class="font-heading font-extrabold text-lg text-white">MOONWALKERS</h1>
                    </div>
                    <span class="w-max flex-shrink-0 bg-cyan-500/10 border border-cyan-400/30 text-cyberCyan text-[10px] font-bold px-2 py-0.5 rounded-full font-code">FTC #38056</span>
                </div>
            </a>
            <!-- DYNAMIC DESKTOP NAVIGATION CONTAINER -->
            <nav id="desktop-nav" class="hidden md:flex items-center gap-6 ml-12 text-xs font-heading font-semibold uppercase tracking-widest">
                <!-- Populated automatically by assets/js/nav.js -->
            </nav>

            <!-- MOBILE MENU BUTTON -->
            <button id="mobileMenuBtn" class="md:hidden text-2xl text-slate-300 p-2" aria-label="Toggle Navigation">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- DYNAMIC MOBILE MENU DROPDOWN CONTAINER -->
        <div id="mobileMenu" class="hidden md:hidden absolute top-[76px] left-0 right-0 bg-cyberDark/95 border-b border-cyan-500/20 p-6 shadow-2xl">
            <div id="mobile-nav-links" class="flex flex-col gap-4 font-heading text-sm font-semibold">
                <!-- Populated automatically by assets/js/nav.js -->
            </div>
        </div>
    </header>

    <main class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex-grow">
        <div class="text-center max-w-3xl mx-auto mb-12">
            <h1 class="font-heading font-black text-4xl sm:text-5xl uppercase tracking-wider text-white">
                THE <span class="text-cyberCyan">TROPHY ROOM</span>
            </h1>
            <p class="text-slate-400 mt-3 text-base">
                Historical awards earned across our FLL seasons and active FTC milestones.
            </p>

            <div class="flex justify-center gap-3 mt-8 font-heading text-xs uppercase">
                <button onclick="filterTrophies('all')" id="btn-all" class="px-5 py-2.5 rounded-lg border border-cyan-400 bg-cyan-500/20 text-white font-bold">All Records</button>
                <button onclick="filterTrophies('fll')" id="btn-fll" class="px-5 py-2.5 rounded-lg border border-slate-800 bg-slate-900/60 text-slate-400 hover:border-slate-700">FLL Legacy</button>
                <button onclick="filterTrophies('ftc')" id="btn-ftc" class="px-5 py-2.5 rounded-lg border border-slate-800 bg-slate-900/60 text-slate-400 hover:border-slate-700">FTC Era</button>
            </div>
        </div>

        <div id="trophy-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-800 text-slate-400 py-8 text-center text-xs">
        <p>&copy; 2026 FTC Team #38056 MoonWalkers.</p>
    </footer>

    <script>
        const trophyDatabase = [
            { id: "t1", title: "Champions Award", category: "fll", year: "2025", event: "Regional Stage", impact: "Mastered PID line-following and structural consistency.", icon: "award" },
            { id: "t2", title: "Robot Design Award", category: "fll", year: "2024", event: "State Championship", impact: "Recognized for custom gearboxes and autonomous modular setups.", icon: "boxes" },
            { id: "t3", title: "Rookie Inspire Contender", category: "ftc", year: "2026", event: "FTC Qualifier Meet", impact: "Proved our software pipeline and outreach capacity against veteran teams.", icon: "sparkles" }
        ];

        function displayTrophies(filter) {
            const grid = document.getElementById("trophy-grid");
            grid.innerHTML = "";
            trophyDatabase.forEach(item => {
                if (filter !== "all" && item.category !== filter) return;
                grid.innerHTML += `
                    <div class="glass-card glass-card-hover p-6 rounded-2xl border-slate-800 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <div class="text-cyberCyan"><i data-lucide="${item.icon}" class="w-6 h-6"></i></div>
                                <span class="text-[10px] font-code font-bold bg-slate-900 text-slate-400 px-2.5 py-1 rounded-full border border-slate-800">${item.year}</span>
                            </div>
                            <h3 class="font-heading text-lg font-bold text-white uppercase">${item.title}</h3>
                            <p class="text-xs text-cyberCyan font-code font-semibold mt-0.5">${item.event}</p>
                            <p class="text-xs text-slate-400 mt-4 leading-relaxed">${item.impact}</p>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function filterTrophies(target) {
            displayTrophies(target);
            ['all', 'fll', 'ftc'].forEach(type => {
                document.getElementById(`btn-${type}`).className = "px-5 py-2.5 rounded-lg border border-slate-800 bg-slate-900/60 text-slate-400 hover:border-slate-700";
            });
            document.getElementById(`btn-${target}`).className = "px-5 py-2.5 rounded-lg border border-cyan-400 bg-cyan-500/20 text-white font-bold";
        }

        document.addEventListener("DOMContentLoaded", () => displayTrophies("all"));
    </script>
    <!-- NAVIGATION & SCRIPTS -->
    <script src="assets/js/nav.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
